name: cached_network_image
description: Flutter library to load and cache network images.
  Can also be used with placeholder and error widgets.
homepage: https://github.com/Baseflow/flutter_cached_network_image
topics:
  - cache
  - image
  - network-image
version: 4.0.1

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  cached_network_image_platform_interface: ^5.0.0
  cached_network_image_web: ^2.0.0
  flutter:
    sdk: flutter
  flutter_cache_manager: ^3.4.5
  material_ui: ^1.0.0
  octo_image: ^2.1.0

dev_dependencies:
  file: ">=7.0.0 <8.0.0"
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4

dependency_overrides:
  flutter_cache_manager:
    git:
      url: git@github.com:glemartret/flutter_cache_manager.git
      path: flutter_cache_manager
      ref: feature/progressive
  cached_network_image_platform_interface:
    git:
      url: git@github.com:glemartret/flutter_cached_network_image.git
      path: cached_network_image_platform_interface
      ref: feature/progressive
  cached_network_image_web:
    git:
      url: git@github.com:glemartret/flutter_cached_network_image.git
      path: cached_network_image_web
      ref: feature/progressive
